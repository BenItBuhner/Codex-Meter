name: Reset auto-use screenshots (temporary)

# One-off: renders the banked-reset auto-use settings, the reset screen and the notifications
# on an Android emulator with sample data. Stills go to refs/ci-screenshots/reset-auto-use.
# Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-m971ew]
    paths: ['.github/workflows/reset-auto-use-screenshots.yml', '.github/reset-auto-shots/**',
            'android/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Self-tests
        run: ./run-tests.sh

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          mkdir -p "$DBG/java/dev/bennett/codexmeter"
          rm -f "$DBG/java/dev/bennett/codexmeter/UsagePaceDemoActivity.java"
          cp .github/reset-auto-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          cat > "$DBG/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application android:usesCleartextTraffic="true"
                  tools:replace="android:usesCleartextTraffic">
                  <activity android:name=".DebugSeedActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"/>
              </application>
          </manifest>
          XML

      - name: Build debug APK
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          shot() { sleep 4; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/.DebugSeedActivity --es open "${1:-main}" --es lowuse "${2:-off}" ${3:+--es lead "$3"}; }
          find_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          best = None
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == sys.argv[2] or n.get('content-desc') == sys.argv[2]:
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  if best is None or b > best[1]:
                      best = ((a + c) // 2, (b + d) // 2)
          if best is None:
              sys.exit(1)
          print(best[0], best[1])
          PY
          }
          tap_text() { local xy; xy=$(find_text "$1") || { echo "no node $1"; return 1; }; adb shell input tap $xy; }
          scroll_to() {
            for i in 1 2 3 4 5 6; do
              local xy; xy=$(find_text "$1") && { set -- $xy; [ "$2" -lt 1900 ] && return 0; }
              adb shell input swipe 540 1700 540 900 400; sleep 1
            done
          }
          run_set() {
            local p="$1"
            seed credits off;                         shot "$p-01-reset-screen-default"
            seed refresh off; scroll_to "Watch";      shot "$p-02-settings-default"
            seed credits on;                          shot "$p-03-reset-screen-both-rules"
            seed refresh on; scroll_to "Watch";       shot "$p-04-settings-both-rules"
          }
          run_set light
          seed refresh off; scroll_to "Watch"
          tap_text "When to use it";                 shot light-05-lead-time-choices
          adb shell input keyevent 4; sleep 1
          tap_text "Use a reset when running low";   shot light-06-turn-on-confirmation
          tap_text "Turn on"; sleep 1
          tap_text "Use when remaining reaches";     shot light-07-threshold-choices
          adb shell input keyevent 4; sleep 1
          tap_text "Watch";                          shot light-08-window-choices
          adb shell input keyevent 4; sleep 1
          seed notify on; sleep 3
          adb shell cmd statusbar expand-notifications; shot light-09-notifications
          adb shell cmd statusbar collapse
          seed main off;                             shot light-10-dashboard
          adb shell cmd uimode night yes
          run_set dark
          adb shell cmd uimode night no
          adb logcat -d -s DebugSeed:* AndroidRuntime:E > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: reset-auto-shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: reset-auto-shots
          path: shots
      - name: Publish to refs/ci-screenshots/reset-auto-use
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Reset auto-use screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/reset-auto-use
