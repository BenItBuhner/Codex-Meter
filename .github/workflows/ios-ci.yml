name: iOS CI

on:
  pull_request:
    branches: [main, alpha]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
      - '.github/scripts/ci-areas.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lets the required gate's macOS jobs take runners first (see the script).
  gate-first:
    name: Let the CI gate's macOS jobs start first
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Wait until the gate's macOS jobs have runners
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/wait-for-gate-macos.sh

  # Which iOS jobs this change needs (.github/scripts/ci-areas.sh ios): a watch-only change runs
  # only the watch job, an app change skips the watch. Manual runs, a "full CI" label and
  # "[full ci]" in the head commit's message run everything.
  changes:
    name: Changed iOS areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.areas.outputs.core }}
      app: ${{ steps.areas.outputs.app }}
      gallery: ${{ steps.areas.outputs.gallery }}
      ipad: ${{ steps.areas.outputs.ipad }}
      watch: ${{ steps.areas.outputs.watch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Work out which areas changed
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full CI') }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request || "$FULL_LABEL" == true ]]; then
            .github/scripts/ci-areas.sh ios --all
          elif git log -1 --format=%B "$HEAD" | grep -qiF '[full ci]'; then
            .github/scripts/ci-areas.sh ios --all
          else
            git diff --name-only "$BASE...$HEAD" | .github/scripts/ci-areas.sh ios
          fi

  core-tests:
    name: CodexMeterCore package tests
    needs: [gate-first, changes]
    # Runs after the wait, or straight away on manual runs (no wait job), when its area changed.
    if: ${{ !cancelled() && needs.gate-first.result != 'failure' && needs.changes.outputs.core == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        shell: bash
        run: swift --version

      - name: Run CodexMeterCore tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path CodexMeterCore

  # The UI suite and the demo gallery each take about 20 minutes, so they run side by side.
  # The UI tests in two halves on two simulators; new test classes land in the main half.
  app-build-and-test:
    name: App simulator tests (${{ matrix.shard }})
    needs: [gate-first, changes]
    # Runs after the wait, or straight away on manual runs (no wait job), when its area changed.
    if: ${{ !cancelled() && needs.gate-first.result != 'failure' && needs.changes.outputs.app == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit tests and main UI suite
            key: main
            tests: -skip-testing:CodexMeterUITests/DemoGalleryTests -skip-testing:CodexMeterUITests/PriorityParityUITests
          - shard: Priority UI tests
            key: priority
            tests: -only-testing:CodexMeterUITests/PriorityParityUITests
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        shell: bash
        run: xcodebuild -version

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE="iPhone 17e"
          if ! xcrun simctl list devices available | grep -Fq "$DEVICE ("; then
            DEVICE="$(xcrun simctl list devices available \
              | sed -nE 's/^[[:space:]]+(iPhone [A-Za-z0-9 ]*[A-Za-z0-9]) \(.*/\1/p' \
              | head -n 1)"
          fi
          if [[ -z "$DEVICE" ]]; then
            echo "::error::No available iPhone simulator on this runner image"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        id: build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO -quiet build-for-testing

      - name: Run unit and UI tests on simulator
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.simulator.outputs.device }}
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          # -retry-tests-on-failure absorbs shared-runner simulator jank in the
          # UI tests; deterministic failures still fail after 3 iterations, and
          # pass-on-retry results stay visible in the xcresult bundle.
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild test-without-building -project CodexMeter.xcodeproj -scheme CodexMeter \
              -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              -parallel-testing-enabled NO \
              $TESTS \
              -retry-tests-on-failure -test-iterations 3 \
              | xcbeautify --renderer github-actions
          else
            xcodebuild test-without-building -project CodexMeter.xcodeproj -scheme CodexMeter \
              -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              -parallel-testing-enabled NO \
              $TESTS \
              -retry-tests-on-failure -test-iterations 3
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.key }}
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 3

  demo-gallery:
    name: Demo gallery
    needs: [gate-first, changes]
    # Runs after the wait, or straight away on manual runs (no wait job), when its area changed.
    if: ${{ !cancelled() && needs.gate-first.result != 'failure' && needs.changes.outputs.gallery == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE="iPhone 17e"
          if ! xcrun simctl list devices available | grep -Fq "$DEVICE ("; then
            DEVICE="$(xcrun simctl list devices available \
              | sed -nE 's/^[[:space:]]+(iPhone [A-Za-z0-9 ]*[A-Za-z0-9]) \(.*/\1/p' \
              | head -n 1)"
          fi
          if [[ -z "$DEVICE" ]]; then
            echo "::error::No available iPhone simulator on this runner image"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        id: build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO -quiet build-for-testing

      - name: Record demo gallery
        id: gallery
        continue-on-error: true
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          ./ci/record-demo-gallery.sh "$DEVICE_NAME" "$PWD/ci-gallery" DerivedData

      - name: Summarize demo gallery
        if: steps.gallery.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iOS demo gallery"
            echo
            echo "Download the **ios-demo-gallery** artifact on this run: \`codex-meter-demo.mp4\` is the screen recording of the offline demo tour and the numbered PNGs are one still per screen, in visit order."
            echo
            if [[ -d ci-gallery ]]; then
              echo '```'
              ls -1 ci-gallery
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload demo gallery
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-demo-gallery
          path: ios/ci-gallery/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload gallery test results on failure
        if: steps.gallery.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ios-gallery-results
          path: ios/GalleryResults.xcresult
          if-no-files-found: ignore
          retention-days: 3

  # One job per iPad (each gallery takes 8-15 minutes), so they run side by side.
  ipad-layout:
    name: iPad ${{ matrix.title }}
    needs: [gate-first, changes]
    # Runs after the wait, or straight away on manual runs (no wait job), when its area changed.
    if: ${{ !cancelled() && needs.gate-first.result != 'failure' && needs.changes.outputs.ipad == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: pro
            title: Pro 13-inch gallery (light and dark)
            pattern: '^iPad Pro 13;^iPad Pro'
            appearances: light dark
          - slot: air
            title: Air 11-inch gallery
            pattern: '^iPad Air 11;^iPad( \(|$)'
            appearances: light
          - slot: mini
            title: mini gallery
            pattern: '^iPad mini'
            appearances: light
          - slot: suite
            title: Pro 13-inch iPhone UI tests
            pattern: '^iPad Pro 13;^iPad Pro'
            appearances: ''
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Pick the iPad simulator
        id: ipad
        shell: bash
        env:
          PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available | grep -i ipad || true
          names="$(xcrun simctl list devices available \
            | sed -nE 's/^[[:space:]]+(iPad[^()]*(\([^)]*\))?) \([0-9A-F-]{36}\).*/\1/p' \
            | sed -E 's/[[:space:]]+$//')"
          # Alternatives are split by ';'; the first that matches wins (for example iPad Pro 13-inch before any iPad Pro).
          DEVICE=""
          IFS=';' read -ra alternatives <<< "$PATTERN"
          for alternative in "${alternatives[@]}"; do
            DEVICE="$(grep -E "$alternative" <<< "$names" | head -n 1 || true)"
            [[ -n "$DEVICE" ]] && break
          done
          if [[ -z "$DEVICE" ]]; then
            echo "::warning::No iPad matching $PATTERN on this runner image"
          fi
          echo "Using: ${DEVICE:-none}"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        id: build
        if: steps.ipad.outputs.device != ''
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO -quiet build-for-testing

      - name: Record the iPad gallery
        if: matrix.appearances != '' && steps.ipad.outputs.device != ''
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.ipad.outputs.device }}
          APPEARANCES: ${{ matrix.appearances }}
        run: |
          set -uo pipefail
          status=0
          for appearance in $APPEARANCES; do
            ./ci/record-ipad-gallery.sh "$DEVICE_NAME" "$PWD/ci-ipad-gallery" "$appearance" DerivedData || status=1
          done
          exit "$status"

      - name: iPhone UI tests on iPad Pro
        if: matrix.slot == 'suite' && steps.ipad.outputs.device != ''
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.ipad.outputs.device }}
        run: |
          set -euo pipefail
          # The main UI suite also runs on iPad, so the sidebar never breaks a flow that
          # works on iPhone.
          xcodebuild test-without-building -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -derivedDataPath DerivedData \
            -resultBundlePath iPadSuiteResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:CodexMeterUITests/CodexMeterUITests \
            -retry-tests-on-failure -test-iterations 3

      - name: Summarize iPad gallery
        if: (success() || failure()) && matrix.appearances != ''
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iPad gallery (${{ steps.ipad.outputs.device }})"
            echo
            echo "Download the **ipad-gallery-${{ matrix.slot }}** artifact: one folder per appearance."
            echo
            if [[ -d ci-ipad-gallery ]]; then
              echo '```'
              (cd ci-ipad-gallery && find . -name '*.png' | sort)
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iPad gallery
        if: (success() || failure()) && matrix.appearances != ''
        uses: actions/upload-artifact@v7
        with:
          name: ipad-gallery-${{ matrix.slot }}
          path: ios/ci-ipad-gallery/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iPad test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-test-results-${{ matrix.slot }}
          path: ios/iPad*.xcresult
          if-no-files-found: ignore
          retention-days: 3

  watch-build-and-gallery:
    name: Apple Watch build and gallery
    needs: [gate-first, changes]
    # Runs after the wait, or straight away on manual runs (no wait job), when its area changed.
    if: ${{ !cancelled() && needs.gate-first.result != 'failure' && needs.changes.outputs.watch == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        shell: bash
        run: xcodebuild -version

      - name: Build watch app and record gallery
        shell: bash
        run: |
          set -euo pipefail
          ./ci/record-watch-gallery.sh "$PWD/watch-gallery" DerivedDataWatch

      - name: Summarize watch gallery
        if: success() || failure()
        shell: bash
        run: |
          {
            echo "## Apple Watch gallery"
            echo
            echo "Download the **watch-gallery** artifact: one PNG per watch screen, using the app's built-in demo data."
            if [[ -d watch-gallery ]]; then
              echo '```'
              ls -1 watch-gallery
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watch gallery
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: watch-gallery
          path: ios/watch-gallery/
          if-no-files-found: warn
          retention-days: 14
