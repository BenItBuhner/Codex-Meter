name: iOS CI

on:
  pull_request:
    branches: [main, alpha]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-tests:
    name: CodexMeterCore package tests
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        shell: bash
        run: swift --version

      - name: Run CodexMeterCore tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path CodexMeterCore

  app-build-and-test:
    name: App build and simulator tests
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        shell: bash
        run: xcodebuild -version

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE="iPhone 17e"
          if ! xcrun simctl list devices available | grep -Fq "$DEVICE ("; then
            DEVICE="$(xcrun simctl list devices available \
              | sed -nE 's/^[[:space:]]+(iPhone [A-Za-z0-9 ]*[A-Za-z0-9]) \(.*/\1/p' \
              | head -n 1)"
          fi
          if [[ -z "$DEVICE" ]]; then
            echo "::error::No available iPhone simulator on this runner image"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build app for generic iOS Simulator
        id: build
        shell: bash
        run: |
          set -euo pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath DerivedData \
              CODE_SIGNING_ALLOWED=NO build \
              | xcbeautify --renderer github-actions
          else
            xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath DerivedData \
              CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Run unit and UI tests on simulator
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          # -retry-tests-on-failure absorbs shared-runner simulator jank in the
          # UI tests; deterministic failures still fail after 3 iterations, and
          # pass-on-retry results stay visible in the xcresult bundle.
          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
              -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              -parallel-testing-enabled NO \
              -skip-testing:CodexMeterUITests/DemoGalleryTests \
              -retry-tests-on-failure -test-iterations 3 test \
              | xcbeautify --renderer github-actions
          else
            xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
              -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              -parallel-testing-enabled NO \
              -skip-testing:CodexMeterUITests/DemoGalleryTests \
              -retry-tests-on-failure -test-iterations 3 test
          fi

      - name: Record demo gallery
        id: gallery
        if: (success() || failure()) && steps.simulator.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          ./ci/record-demo-gallery.sh "$DEVICE_NAME" "$PWD/ci-gallery" DerivedData

      - name: Summarize demo gallery
        if: steps.gallery.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iOS demo gallery"
            echo
            echo "Download the **ios-demo-gallery** artifact on this run: \`codex-meter-demo.mp4\` is the screen recording of the offline demo tour and the numbered PNGs are one still per screen, in visit order."
            echo
            if [[ -d ci-gallery ]]; then
              echo '```'
              ls -1 ci-gallery
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload demo gallery
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-demo-gallery
          path: ios/ci-gallery/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results on failure
        if: failure() || steps.gallery.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/GalleryResults.xcresult
          if-no-files-found: ignore
          retention-days: 3

  ipad-layout:
    name: iPad layout tests and screenshots
    runs-on: macos-26
    timeout-minutes: 130
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Pick iPad simulators
        id: ipads
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available | grep -i ipad || true
          # Smallest, mid-size and largest iPad screens the runner image offers.
          pick() {
            xcrun simctl list devices available \
              | sed -nE 's/^[[:space:]]+(iPad[^()]*(\([^)]*\))?) \([0-9A-F-]{36}\).*/\1/p' \
              | sed -E 's/[[:space:]]+$//' \
              | grep -E "$1" | head -n 1 || true
          }
          MINI="$(pick '^iPad mini')"
          AIR="$(pick '^iPad Air 11')"
          [[ -n "$AIR" ]] || AIR="$(pick '^iPad( \(|$)')"
          PRO="$(pick '^iPad Pro 13')"
          [[ -n "$PRO" ]] || PRO="$(pick '^iPad Pro')"
          if [[ -z "$PRO$AIR$MINI" ]]; then
            echo "::error::No iPad simulators on this runner image"
            exit 1
          fi
          echo "Using: ${PRO:-none} / ${AIR:-none} / ${MINI:-none}"
          {
            echo "pro=$PRO"
            echo "air=$AIR"
            echo "mini=$MINI"
          } >> "$GITHUB_OUTPUT"

      - name: Build for testing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: iPad Pro 13-inch (light)
        if: steps.ipads.outputs.pro != ''
        shell: bash
        run: ./ci/record-ipad-gallery.sh "${{ steps.ipads.outputs.pro }}" "$PWD/ci-ipad-gallery" light DerivedData

      - name: iPad Pro 13-inch (dark)
        if: (success() || failure()) && steps.ipads.outputs.pro != ''
        shell: bash
        run: ./ci/record-ipad-gallery.sh "${{ steps.ipads.outputs.pro }}" "$PWD/ci-ipad-gallery" dark DerivedData

      - name: iPad Air 11-inch (light)
        if: (success() || failure()) && steps.ipads.outputs.air != ''
        shell: bash
        run: ./ci/record-ipad-gallery.sh "${{ steps.ipads.outputs.air }}" "$PWD/ci-ipad-gallery" light DerivedData

      - name: iPad mini (light)
        if: (success() || failure()) && steps.ipads.outputs.mini != ''
        shell: bash
        run: ./ci/record-ipad-gallery.sh "${{ steps.ipads.outputs.mini }}" "$PWD/ci-ipad-gallery" light DerivedData

      - name: iPhone UI tests on iPad Pro
        if: (success() || failure()) && steps.ipads.outputs.pro != ''
        shell: bash
        env:
          DEVICE_NAME: ${{ steps.ipads.outputs.pro }}
        run: |
          set -euo pipefail
          # The main UI suite also runs on iPad, so the sidebar never breaks a flow that
          # works on iPhone.
          xcodebuild test-without-building -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -derivedDataPath DerivedData \
            -resultBundlePath iPadSuiteResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:CodexMeterUITests/CodexMeterUITests \
            -retry-tests-on-failure -test-iterations 3

      - name: Summarize iPad gallery
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iPad gallery"
            echo
            echo "Download the **ipad-gallery** artifact: one folder per simulator and appearance."
            echo
            if [[ -d ci-ipad-gallery ]]; then
              echo '```'
              (cd ci-ipad-gallery && find . -name '*.png' | sort)
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iPad gallery
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-gallery
          path: ios/ci-ipad-gallery/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iPad test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-test-results
          path: ios/iPad*.xcresult
          if-no-files-found: ignore
          retention-days: 3

  watch-build-and-gallery:
    name: Apple Watch build and gallery
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        shell: bash
        run: xcodebuild -version

      - name: Build watch app and record gallery
        shell: bash
        run: |
          set -euo pipefail
          ./ci/record-watch-gallery.sh "$PWD/watch-gallery" DerivedDataWatch

      - name: Summarize watch gallery
        if: success() || failure()
        shell: bash
        run: |
          {
            echo "## Apple Watch gallery"
            echo
            echo "Download the **watch-gallery** artifact: one PNG per watch screen, using the app's built-in demo data."
            if [[ -d watch-gallery ]]; then
              echo '```'
              ls -1 watch-gallery
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watch gallery
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: watch-gallery
          path: ios/watch-gallery/
          if-no-files-found: warn
          retention-days: 14
