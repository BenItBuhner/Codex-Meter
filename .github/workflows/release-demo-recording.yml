name: Release demo recording (temporary)

# One-off: records phone and Wear OS emulator clips for the 3.0.0 demo video and publishes
# them to refs/ci-screenshots/release-3-0-demo. Removed before the release PR merges.
on:
  push:
    branches: [claude/project-thread-ojm4zp]
    paths: ['.github/workflows/release-demo-recording.yml', '.github/release-demo/**']

permissions:
  contents: write
  packages: read

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          cp .github/release-demo/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          python3 - "$DBG/AndroidManifest.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('</application>', '<activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay"/>\n    </application>')
          open(p, 'w').write(s)
          PY

      - name: Build debug APK and stand-in apps
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash .github/release-demo/make-stub.sh com.anthropic.claude "Claude" "$RUNNER_TEMP/claude.apk"
          bash .github/release-demo/make-stub.sh com.openai.chatgpt "ChatGPT" "$RUNNER_TEMP/chatgpt.apk"
          cd android
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          script: bash .github/release-demo/phone.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone
          path: demo/
          retention-days: 3

  wear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Wear toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Build debug Wear app
        working-directory: android
        run: ./gradlew --no-daemon :wear:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/release-demo/wear.sh android/wear/build/outputs/apk/debug/wear-debug.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wear
          path: demo/
          retention-days: 3

  publish:
    needs: [phone, wear]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: demo
          merge-multiple: true
      - name: Publish to refs/ci-screenshots/release-3-0-demo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd demo
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Release demo clips"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/release-3-0-demo
