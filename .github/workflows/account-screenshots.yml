name: Multiple accounts screenshots (temporary)

# One-off: installs this branch with sample accounts and records the account switcher.
# Output goes to refs/ci-screenshots/multi-account. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-rk4s0k]
    paths: ['.github/workflows/account-screenshots.yml', '.github/account-shots/**',
            'android/app/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          cp .github/account-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          python3 - "$DBG/AndroidManifest.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('</application>', '<activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay"/>\n    </application>')
          open(p, 'w').write(s)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          adb shell settings put global hide_error_dialogs 1 || true
          shot() { sleep "${2:-3}"; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() {
            adb shell am force-stop $PKG; sleep 1
            adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es action "${1:-seed}" --es tab "${2:-claude_code}" --es design "${3:-oneui9}"; sleep 4
          }
          locate() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          want = sys.argv[2]
          for n in ET.parse(sys.argv[1]).iter('node'):
              t, d = n.get('text') or '', n.get('content-desc') or ''
              if t == want or d == want or d.startswith(want + ':'):
                  a, b, c, e = map(int, re.findall(r'\d+', n.get('bounds')))
                  print((a + c) // 2, (b + e) // 2)
                  sys.exit(0)
          sys.exit("no node named " + want)
          PY
          }
          tap_text() { local xy; xy=$(locate "$1") && adb shell input tap $xy; }
          dumpui() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml "$OUT/$1.xml" >/dev/null; }

          adb shell cmd uimode night no
          seed; sleep 2
          adb shell "screenrecord --time-limit 90 --size 540x1200 /sdcard/switch-light.mp4" & REC=$!
          sleep 2
          shot light-01-claude-dashboard 2
          dumpui light-01
          tap_text "Accounts";              shot light-02-switcher 2
          dumpui light-02
          tap_text "sam.lee@gmail.com";     shot light-03-switched-toast 1
          shot light-04-switched-dashboard 3
          tap_text "Accounts";              shot light-05-switcher-after 2
          tap_text "sam@acme.dev";          sleep 3
          tap_text "Accounts";              sleep 2
          tap_text "Add another account";   shot light-06-add-started 4
          adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es action finish_add --es tab claude_code; sleep 4
          shot light-07-after-add 1
          tap_text "Accounts";              shot light-08-three-accounts 2
          adb shell input keyevent BACK; sleep 1
          tap_text "Codex";                 shot light-09-codex 3
          tap_text "Accounts";              shot light-10-codex-switcher 2
          adb shell input keyevent BACK; sleep 1
          tap_text "Cursor";                shot light-11-cursor-single 3
          tap_text "Accounts";              shot light-12-cursor-switcher 2
          adb shell input keyevent BACK; sleep 2
          adb shell pkill -INT screenrecord; sleep 3; wait $REC 2>/dev/null
          adb pull /sdcard/switch-light.mp4 "$OUT/switch-light.mp4" >/dev/null

          adb shell cmd uimode night yes
          seed
          adb shell "screenrecord --time-limit 40 --size 540x1200 /sdcard/switch-dark.mp4" & REC=$!
          sleep 2
          shot dark-01-claude-dashboard 2
          tap_text "Accounts";              shot dark-02-switcher 2
          tap_text "sam.lee@gmail.com";     shot dark-04-switched-dashboard 4
          tap_text "Accounts";              shot dark-05-switcher-after 2
          adb shell input keyevent BACK; sleep 2
          adb shell pkill -INT screenrecord; sleep 3; wait $REC 2>/dev/null
          adb pull /sdcard/switch-dark.mp4 "$OUT/switch-dark.mp4" >/dev/null

          adb shell cmd uimode night no
          seed seed claude_code classic
          shot light-20-classic-dashboard 3
          tap_text "Accounts";              shot light-21-classic-switcher 2
          adb logcat -d | grep -iE "DebugSeed|FATAL|AndroidRuntime|accounts|codexmeter" > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shots
          path: shots
      - name: Publish to refs/ci-screenshots/multi-account
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Multiple accounts screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/multi-account
