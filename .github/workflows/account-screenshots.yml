name: Multiple accounts screenshots (temporary)

# One-off: installs this branch with sample accounts and records the account switcher.
# Output goes to refs/ci-screenshots/multi-account-review. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-rk4s0k]
    paths: ['.github/workflows/account-screenshots.yml', '.github/account-shots/**',
            'android/app/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          cp .github/account-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          python3 - "$DBG/AndroidManifest.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('</application>', '<activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay"/>\n    </application>')
          open(p, 'w').write(s)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          adb shell settings put global hide_error_dialogs 1 || true
          shot() { sleep "${2:-3}"; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() {
            adb shell am force-stop $PKG; sleep 1
            adb shell am start -W --activity-clear-task -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es action "${1:-seed}" --es tab "${2:-claude_code}" --es design "${3:-oneui9}"; sleep 4
          }
          locate() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          want = sys.argv[2]
          for n in ET.parse(sys.argv[1]).iter('node'):
              t, d = n.get('text') or '', n.get('content-desc') or ''
              if t == want or d == want or d.startswith(want + ':'):
                  a, b, c, e = map(int, re.findall(r'\d+', n.get('bounds')))
                  print((a + c) // 2, (b + e) // 2)
                  sys.exit(0)
          sys.exit("no node named " + want)
          PY
          }
          tap_text() { local xy; xy=$(locate "$1") && adb shell input tap $xy; }
          dumpui() { adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml "$OUT/$1.xml" >/dev/null; }

          seedopen() {
            adb shell am force-stop $PKG; sleep 1
            adb shell am start -W --activity-clear-task -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es action "$1" --es open "$2" --es single_claude "${3:-no}"; sleep 4
          }
          drag() { adb shell input swipe 540 1700 540 $((1700 - $1)) 1000; }

          # Dashboard: the account button and switcher.
          adb shell cmd uimode night no
          seed; sleep 2
          adb shell "screenrecord --time-limit 70 --size 540x1200 /sdcard/dashboard-light.mp4" & REC=$!
          sleep 2
          shot light-01-claude-dashboard 2
          tap_text "Accounts";              shot light-02-switcher 2
          tap_text "sam.lee@gmail.com";     shot light-03-switched-toast 1
          shot light-04-switched-dashboard 3
          tap_text "Accounts";              shot light-05-switcher-after 2
          tap_text "sam@acme.dev";          sleep 3
          tap_text "Accounts";              sleep 2
          tap_text "Add another account";   shot light-06-add-browser 7
          adb shell input keyevent BACK;    shot light-06b-adding-empty 3
          adb shell am start -W --activity-clear-task -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es action finish_add --es tab claude_code; sleep 4
          shot light-07-after-add 1
          tap_text "Accounts";              shot light-08-three-accounts 2
          adb shell input keyevent BACK; sleep 2
          adb shell pkill -INT screenrecord; sleep 3; wait $REC 2>/dev/null
          adb pull /sdcard/dashboard-light.mp4 "$OUT/dashboard-light.mp4" >/dev/null

          adb shell cmd uimode night yes
          seed
          shot dark-01-claude-dashboard 2
          tap_text "Accounts";              shot dark-02-switcher 2
          adb shell input keyevent BACK; sleep 1

          # Settings: one Providers & accounts page.
          for mode in light dark; do
            [[ $mode == dark ]] && adb shell cmd uimode night yes || adb shell cmd uimode night no
            seedopen seed settings;          shot $mode-30-settings-root 2
            tap_text "Providers & accounts"; shot $mode-31-providers-accounts 3
            drag 900;                        shot $mode-32-providers-scrolled 2
          done
          adb shell cmd uimode night no
          seedopen seed providers
          adb shell "screenrecord --time-limit 60 --size 540x1200 /sdcard/settings-light.mp4" & REC=$!
          sleep 2
          tap_text "sam.lee@gmail.com";     shot light-34-after-switch 2
          tap_text "sam.lee@gmail.com";     shot light-35-sign-out-prompt 2
          adb shell input keyevent BACK; sleep 1
          drag 900; sleep 1
          tap_text "Add a provider";        shot light-36-add-provider 3
          adb shell input keyevent BACK; sleep 2
          adb shell pkill -INT screenrecord; sleep 3; wait $REC 2>/dev/null
          adb pull /sdcard/settings-light.mp4 "$OUT/settings-light.mp4" >/dev/null

          # Onboarding: Claude connected with one account, add a second.
          seedopen seed onboarding yes
          adb shell "screenrecord --time-limit 60 --size 540x1200 /sdcard/onboarding-light.mp4" & REC=$!
          sleep 2
          shot light-40-onboarding-one 1
          tap_text "Add another account";   shot light-41-onboarding-browser 7
          adb shell input keyevent BACK;    shot light-42-onboarding-adding 3
          adb shell am start -W --activity-clear-task -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es action finish_add --es open onboarding; sleep 4
          shot light-43-onboarding-two 1
          tap_text "Continue";              shot light-44-onboarding-done 3
          adb shell pkill -INT screenrecord; sleep 3; wait $REC 2>/dev/null
          adb pull /sdcard/onboarding-light.mp4 "$OUT/onboarding-light.mp4" >/dev/null

          adb shell cmd uimode night yes
          seedopen seed onboarding;         shot dark-43-onboarding-two 2
          adb shell cmd uimode night no
          adb logcat -d | grep -iE "DebugSeed|FATAL|AndroidRuntime|accounts|codexmeter" > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shots
          path: shots
      - name: Publish to refs/ci-screenshots/multi-account
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Multiple accounts screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/multi-account-review
