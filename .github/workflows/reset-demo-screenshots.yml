name: Saved reset estimate demos (temporary)

# One-off: builds this branch and alpha with the same Claude Code saved-reset sample data,
# then captures the dashboard and Usage history for a before/after.
# Output goes to refs/ci-screenshots/reset-demos. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-6cnuxx]
    paths: ['.github/workflows/reset-demo-screenshots.yml', '.github/reset-demo/**',
            'android/app/**', 'android/shared/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Build before (alpha) and after (this branch) with the demo seeder
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          git worktree add "$RUNNER_TEMP/before" origin/alpha
          build() {
            local root="$1" out="$2"
            local dbg="$root/android/app/src/debug"
            cp .github/reset-demo/DemoScenarioActivity.java "$dbg/java/dev/bennett/codexmeter/"
            python3 - "$dbg/AndroidManifest.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('</application>', '<activity android:name="dev.bennett.codexmeter.DemoScenarioActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay"/>\n    </application>')
          open(p, 'w').write(s)
          PY
            for i in 1 2 3; do
              (cd "$root/android" && ./gradlew --no-daemon :app:assembleDebug) && break
              [[ $i == 3 ]] && exit 1
              sleep $((i * 15))
            done
            cp "$root/android/app/build/outputs/apk/debug/app-debug.apk" "$out"
          }
          build "$RUNNER_TEMP/before" "$RUNNER_TEMP/before.apk"
          build "$GITHUB_WORKSPACE" "$RUNNER_TEMP/after.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb shell cmd connectivity airplane-mode enable || true
          adb shell settings put global hide_error_dialogs 1 || true
          shot() { sleep "${2:-3}"; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() {
            adb shell am force-stop $PKG; sleep 1
            adb shell am start -W -n $PKG/dev.bennett.codexmeter.DemoScenarioActivity "$@"; sleep 4
          }
          drag() { adb shell input swipe 540 1800 540 $((1800 - $1)) 1500; sleep 2; }
          for variant in before after; do
            adb uninstall $PKG >/dev/null 2>&1 || true
            adb install -r "$RUNNER_TEMP/$variant.apk"
            for mode in dark light; do
              if [[ $mode == dark ]]; then adb shell cmd uimode night yes; else adb shell cmd uimode night no; fi
              seed;      shot $mode-$variant-01-dashboard 4
              drag 1000; shot $mode-$variant-02-history 2
              drag 600;  shot $mode-$variant-03-history-more 2
            done
          done
          adb logcat -d | grep -iE "CodexNowBar|DemoScenario|FATAL|AndroidRuntime|codexmeter" > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shots
          path: shots
      - name: Publish to refs/ci-screenshots/reset-demos
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Saved reset estimate demos"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/reset-demos
