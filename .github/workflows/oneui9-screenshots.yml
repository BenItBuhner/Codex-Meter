name: One UI 9 screenshots (temporary)

# One-off: renders the same screens on the standard (One UI 8) build and the One UI 9 preview
# build with sample data. Stills go to refs/ci-screenshots/oneui9. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-cidms8]
    paths: ['.github/workflows/oneui9-screenshots.yml', '.github/oneui9-shots/**',
            'android/app/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [oneui8, oneui9]
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          mkdir -p "$DBG/java/dev/bennett/codexmeter"
          cp .github/oneui9-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          cat > "$DBG/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application android:usesCleartextTraffic="true"
                  tools:replace="android:usesCleartextTraffic">
                  <activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"/>
              </application>
          </manifest>
          XML

      - name: Build debug APK
        working-directory: android
        run: |
          FLAG=""
          [[ "${{ matrix.variant }}" == "oneui9" ]] && FLAG="-PoneUi9=true"
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug $FLAG && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          V="$VARIANT"
          PKG=dev.bennett.codexmeter
          [[ "$V" == "oneui9" ]] && PKG=dev.bennett.codexmeter.oneui9
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          shot() { sleep 5; adb exec-out screencap -p > "$OUT/$V-$1.png"; echo "captured $1"; }
          seed() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es enabled "${1:-none}" --es selected "${2:-codex}" --es open "${3:-main}"; }
          swipe() { adb shell input swipe 540 1900 540 800 700; }
          SET=codex,claude_code,cursor
          run_set() {
            local p="$1"
            seed $SET codex;                 shot "$p-01-codex"
            swipe;                           shot "$p-02-codex-scrolled"
            seed $SET claude_code;           shot "$p-03-claude"
            seed $SET cursor;                shot "$p-04-cursor"
            seed $SET codex settings;        shot "$p-05-settings"
            swipe;                           shot "$p-06-settings-scrolled"
            seed $SET codex appearance;      shot "$p-07-appearance"
          }
          run_set light
          adb shell cmd uimode night yes
          run_set dark
          adb shell cmd uimode night no
          adb logcat -d -s DebugSeed:* AndroidRuntime:E > "$OUT/$V-logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VARIANT: ${{ matrix.variant }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shots-${{ matrix.variant }}
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots
      - name: Publish to refs/ci-screenshots/oneui9
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "One UI 9 screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/oneui9
