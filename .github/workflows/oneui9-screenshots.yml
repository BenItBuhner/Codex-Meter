name: One UI 9 strip screenshots (temporary)

# One-off: renders this branch in classic and One UI 9 mode and alpha.6 classic (reference), at
# rest and at several scroll depths, plus recordings of scrolling and of the design switch.
# Output goes to refs/ci-screenshots/oneui9-strip. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-1ysv32]
    paths: ['.github/workflows/oneui9-screenshots.yml', '.github/oneui9-shots/**',
            'android/app/**', 'android/oneui9compat/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [before-sim, after-sim, after-stock]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use alpha (before the fix) for the reference shots
        if: matrix.variant == 'before-sim'
        run: |
          cp -r .github/oneui9-shots "$RUNNER_TEMP/shots-src"
          git checkout --force 9733293
          mkdir -p .github/oneui9-shots && cp "$RUNNER_TEMP/shots-src/"* .github/oneui9-shots/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          mkdir -p "$DBG/java/dev/bennett/codexmeter"
          cp .github/oneui9-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          cat > "$DBG/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application android:usesCleartextTraffic="true"
                  tools:replace="android:usesCleartextTraffic">
                  <activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"/>
              </application>
          </manifest>
          XML

      - name: Build debug APK
        working-directory: android
        run: |
          FLAG=""
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug $FLAG && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          V="$VARIANT"
          PKG=dev.bennett.codexmeter
          DESIGN=oneui9
          SAMSUNG=0
          [[ "$V" == *-sim ]] && SAMSUNG=1
          # Samsung's fade uses hidden Canvas.saveUnclippedLayer; let the app reach it.
          adb shell settings put global hidden_api_policy 1 || true
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT/rec"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          # The emulator launcher sometimes ANRs; keep its dialog off the captures.
          adb shell settings put global hide_error_dialogs 1 || true
          # Animations on for the recordings (the runner disables them by default).
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          shot() { sleep 4; adb exec-out screencap -p > "$OUT/$V-$1.png"; echo "captured $1"; }
          seed() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es enabled "${1:-none}" --es selected "${2:-codex}" --es open "${3:-main}" --es design "${4:-$DESIGN}" --es samsung $SAMSUNG; sleep 3; }
          locate() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          best = None
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == sys.argv[2] or n.get('content-desc') == sys.argv[2]:
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  if best is None or b > best[1]:
                      best = ((a + c) // 2, (b + d) // 2)
          if best is None:
              sys.exit("no node named " + sys.argv[2])
          print(best[0], best[1])
          PY
          }
          tap_text() { local xy; xy=$(locate "$1") && adb shell input tap $xy; }
          swipe_up() { adb shell input swipe 540 1900 540 700 600; }
          swipe_down() { adb shell input swipe 540 700 540 1900 600; }
          # record NAME SECONDS then the actions run while recording
          rec_start() { adb shell "screenrecord --time-limit $2 --size 540x1200 /sdcard/$1.mp4" & REC=$!; sleep 1; }
          rec_stop() { wait $REC; adb pull /sdcard/$1.mp4 "$OUT/rec/$V-$1.mp4" >/dev/null; }
          SET=codex,claude_code,cursor
          # Slow drags (no fling) so each depth is repeatable: a little, past the title, far.
          drag() { if (( $1 < 0 )); then adb shell input swipe 540 700 540 $((700 - $1)) 1200; else adb shell input swipe 540 1600 540 $((1600 - $1)) 1200; fi; }
          depths() {
            local n="$1"
            shot "$n-0-rest"
            drag 250;  shot "$n-1-little"
            drag 450;  shot "$n-2-collapsed"
            drag 900;  shot "$n-3-far"
            drag 900;  shot "$n-4-farther"
          }
          run_set() {
            local p="$1"
            seed $SET codex settings;           depths "$p-settings"
            seed $SET codex;                    depths "$p-dashboard"
            seed $SET codex appearance;         depths "$p-appearance"
            seed $SET codex widget;             depths "$p-widget"
            seed $SET codex settings; drag 1400; sleep 1; tap_text "About Codex Meter"; sleep 2; depths "$p-about"
          }
          full_scroll() {
            rec_start "$1" 40
            sleep 1; drag 250; sleep 1; drag 250; sleep 1; drag 500; sleep 1; drag 900; drag 900; drag 900; sleep 2
            drag -900; drag -900; sleep 1; drag -500; sleep 1; drag -250; sleep 1; drag -250; sleep 1; drag -900; sleep 3
            rec_stop "$1"
          }
          for mode in dark light; do
            [[ $mode == dark ]] && adb shell cmd uimode night yes || adb shell cmd uimode night no
            run_set $mode
            seed $SET codex settings; full_scroll scroll-settings-$mode
            seed $SET codex;          full_scroll scroll-dashboard-$mode
          done
          adb shell cmd uimode night no
          adb logcat -d -s DebugSeed:* AndroidRuntime:E ActivityManager:I | grep -iE "DebugSeed|FATAL|Exception|Start proc .*codexmeter|codexmeter.*died" > "$OUT/$V-logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VARIANT: ${{ matrix.variant }}
        with:
          api-level: ${{ matrix.variant == 'after-stock' && 34 || 36 }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash ${{ runner.temp }}/capture.sh

      - name: Turn recordings into frame strips
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          cd shots/rec
          for f in *.mp4; do
            [[ -f "$f" ]] || continue
            RATE=8; GRID=10x5
            [[ "$f" == *toggle* ]] && { RATE=1; GRID=10x6; }
            [[ "$f" == *scroll* ]] && { RATE=3; GRID=8x6; }
            ffmpeg -loglevel error -i "$f" -vf "fps=$RATE,scale=180:-1,tile=$GRID" -frames:v 1 "../${f%.mp4}-frames.png" || true
            cp "$f" ../ || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shots-${{ matrix.variant }}
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots
      - name: Publish to refs/ci-screenshots/oneui9-strip
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "One UI 9 screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/oneui9-strip
