name: Simulator boot probe (temporary)

# Temporary: measures how long iPhone simulators take to boot on each iOS runtime of the runner
# image, to pick the fastest one for CI. Removed once measured.
on:
  pull_request:
    paths: ['.github/workflows/sim-boot-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Time a boot per runtime
        run: |
          set -uo pipefail
          xcrun simctl list runtimes
          xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | "\(.key) \([.value[] | select(.name | startswith("iPhone"))][0].udid // "none") \([.value[] | select(.name | startswith("iPhone"))][0].name // "")"' | while read -r rt udid name; do
            [[ "$udid" == none ]] && continue
            SECONDS=0
            xcrun simctl boot "$udid"
            t_boot=$SECONDS
            xcrun simctl bootstatus "$udid" > "$RUNNER_TEMP/bs-$udid.log" 2>&1
            t_ready=$SECONDS
            slow="$(grep -o 'Running plugin [^ ]*' "$RUNNER_TEMP/bs-$udid.log" | sort | uniq -c | sort -rn | head -3 | tr '\n' ';')"
            echo "RESULT $rt $name: booted ${t_boot}s, ready ${t_ready}s; $slow"
            # Same device again: a second boot of an already-migrated device.
            xcrun simctl shutdown "$udid"
            SECONDS=0
            xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" >/dev/null 2>&1
            echo "RESULT $rt $name: second boot ready ${SECONDS}s"
            xcrun simctl shutdown "$udid"
          done
