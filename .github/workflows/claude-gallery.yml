name: Claude Code phone gallery

on:
  pull_request:
    branches: [main, alpha]
    paths:
      - 'android/app/src/main/java/dev/bennett/codexmeter/Claude*.java'
      - 'android/app/src/main/java/dev/bennett/codexmeter/*Reset*.java'
      - 'android/app/src/main/java/dev/bennett/codexmeter/Priority*.java'
      - 'android/app/src/main/java/dev/bennett/codexmeter/Provider*.java'
      - 'android/app/src/debug/**'
      - 'android/ci/record-claude-gallery.sh'
      - '.github/workflows/claude-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: claude-gallery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-gallery:
    name: Claude Code screens on a phone emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Install Android platforms
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Build debug phone app
        shell: bash
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record Claude Code screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./android/ci/record-claude-gallery.sh android/app/build/outputs/apk/debug/app-debug.apk claude-gallery

      - name: Upload gallery
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: claude-gallery
          path: claude-gallery/
          if-no-files-found: warn
          retention-days: 14
