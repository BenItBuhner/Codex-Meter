name: Claude saved-reset screenshots (temporary)

# One-off: renders the Claude Code "Limit resets" card and its settings with sample data.
# Output goes to refs/ci-screenshots/claude-resets. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-0ovrtt]
    paths: ['.github/workflows/claude-reset-screenshots.yml', '.github/claude-reset-shots/**',
            'android/app/**']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          # The existing debug demo screens don't compile against this branch; not needed here.
          rm -rf "$DBG"
          mkdir -p "$DBG/java/dev/bennett/codexmeter"
          cp .github/claude-reset-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          cat > "$DBG/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application>
                  <activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"/>
              </application>
          </manifest>
          XML

      - name: Build debug APK
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          adb shell settings put global hide_error_dialogs 1 || true
          shot() { sleep 4; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es grant "$1" --es selected "${2:-claude_code}" --es open "${3:-main}"; sleep 3; }
          locate() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          best = None
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == sys.argv[2] or n.get('content-desc') == sys.argv[2]:
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  if best is None or b > best[1]:
                      best = ((a + c) // 2, (b + d) // 2)
          if best is None:
              sys.exit("no node named " + sys.argv[2])
          print(best[0], best[1])
          PY
          }
          tap_text() { local xy; xy=$(locate "$1") && adb shell input tap $xy; }
          swipe_up() { adb shell input swipe 540 1900 540 700 600; }
          scroll_to() { for i in 1 2 3 4 5 6 7 8; do locate "$1" >/dev/null 2>&1 && return 0; swipe_up; sleep 1; done; return 1; }
          run_set() {
            local p="$1"
            seed full codex;               scroll_to "Reset credits"; swipe_up; shot "$p-01-codex-card"
            seed full claude_code;         scroll_to "Reset credits"; swipe_up; shot "$p-02-claude-card"
            seed full codex reset;         shot "$p-03-codex-reset-screen"
            seed full claude_code reset;   shot "$p-04-claude-reset-screen"
            tap_text "Use 1 reset";        shot "$p-05-claude-confirm"
            seed session_held claude_code reset; shot "$p-06-claude-reset-held"
            seed full codex refresh;       scroll_to "Codex reset credits"; swipe_up; shot "$p-07-settings"
          }
          run_set light
          adb shell cmd uimode night yes
          run_set dark
          adb shell cmd uimode night no
          adb logcat -d -s DebugSeed:* AndroidRuntime:E > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

      - name: Publish to refs/ci-screenshots/claude-resets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Claude saved-reset screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/claude-resets
