name: Provider accounts screenshots (temporary)

# One-off: renders the Add account picker, sign-in screens and the bottom provider bar with
# 1 to 12 providers on an Android emulator, with sample data. Stills go to
# refs/ci-screenshots/provider-accounts. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-28mvkr]
    paths: ['.github/workflows/provider-accounts-screenshots.yml', '.github/provider-shots/**',
            'android/app/src/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          mkdir -p "$DBG/java/dev/bennett/codexmeter"
          rm -f "$DBG/java/dev/bennett/codexmeter/UsagePaceDemoActivity.java"
          cp .github/provider-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          cat > "$DBG/AndroidManifest.xml" <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application android:usesCleartextTraffic="true"
                  tools:replace="android:usesCleartextTraffic">
                  <activity android:name=".DebugSeedActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"/>
              </application>
          </manifest>
          XML

      - name: Build debug APK
        working-directory: android
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          shot() { sleep 5; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/.DebugSeedActivity --es enabled "${1:-none}" --es selected "${2:-codex}" --es open "${3:-main}" --es provider "${4:-none}"; }
          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY' | { read -r x y && adb shell input tap "$x" "$y"; }
          import re, sys, xml.etree.ElementTree as ET
          best = None
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == sys.argv[2] or n.get('content-desc') == sys.argv[2]:
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  if best is None or b > best[1]:
                      best = ((a + c) // 2, (b + d) // 2)
          if best is None:
              sys.exit("no node named " + sys.argv[2])
          print(best[0], best[1])
          PY
          }
          ONE=codex
          TWO=codex,claude_code
          FOUR=codex,claude_code,cursor,copilot
          FIVE=codex,claude_code,cursor,copilot,kimi
          MANY=codex,claude_code,cursor,copilot,kimi,factory,grok,antigravity,windsurf,augment,kilo,openrouter
          run_set() {
            local p="$1"
            seed $ONE codex;                    shot "$p-01-tabs-1-provider"
            seed $TWO claude_code;              shot "$p-02-tabs-2-providers"
            seed $FOUR copilot;                 shot "$p-03-tabs-4-providers"
            seed $FIVE codex;                   shot "$p-04-tabs-5-providers"
            seed $MANY codex;                   shot "$p-05-tabs-12-providers"
            tap_text "More";                    shot "$p-06-more-grid"
            tap_text "Antigravity";             shot "$p-07-provider-picked-from-more"
            seed $FOUR codex settings;          shot "$p-08-settings-accounts"
            seed $TWO codex add;                shot "$p-09-add-account"
            seed "" codex settings;             shot "$p-10-settings-no-accounts"
          }
          run_set light
          seed $TWO codex add; tap_text "Search providers"; adb shell input text co; sleep 1
          adb shell input keyevent 111;          shot light-11-add-account-search
          seed $TWO codex sign_in grok;          shot light-12-sign-in-grok-experimental
          seed $TWO codex sign_in augment;       shot light-13-sign-in-augment-paste
          seed $TWO codex sign_in zai;           shot light-14-sign-in-zai-key
          seed $TWO codex sign_in kimi;          shot light-15-sign-in-kimi-device
          seed codex,openrouter,kilo openrouter; shot light-16-openrouter-balance
          seed $MANY copilot;                    shot light-17-copilot-dashboard
          adb shell cmd uimode night yes
          run_set dark
          adb shell cmd uimode night no
          adb shell cmd connectivity airplane-mode disable || true
          sleep 8
          seed $TWO codex sign_in copilot;       shot light-18-sign-in-copilot
          tap_text "Get a sign-in code";         sleep 6; shot light-19-copilot-device-code
          adb shell am force-stop $PKG
          adb shell pm clear $PKG
          adb shell am start -W -n $PKG/.MainActivity; sleep 3
          tap_text "Continue";                   shot light-20-onboarding-picker
          adb logcat -d -s DebugSeed:* AndroidRuntime:E > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ${{ runner.temp }}/capture.sh

      - uses: actions/upload-artifact@v7
        with:
          name: provider-shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: provider-shots
          path: shots
      - name: Publish to refs/ci-screenshots/provider-accounts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Provider accounts screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/provider-accounts
