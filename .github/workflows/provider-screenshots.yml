name: Provider switcher screenshots (temporary)

# One-off: renders the provider switcher on an Android emulator with sample data, collects
# the iOS demo-gallery stills, and publishes both to refs/ci-screenshots/pr118 for review.
on:
  push:
    branches: [claude/provider-switcher-p13ybm]
    paths: ['.github/workflows/provider-screenshots.yml']

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_USERNAME: ${{ github.actor }}
      GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Add a debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug/java/dev/bennett/codexmeter
          # The existing debug-only pace demo no longer compiles against AppPreferences; not needed here.
          rm -f android/app/src/debug/java/dev/bennett/codexmeter/UsagePaceDemoActivity.java
          cat > android/app/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application>
                  <activity android:name=".DebugSeedActivity" android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"/>
                  <activity android:name=".DebugComponentGalleryActivity" android:exported="true"
                      android:theme="@style/AppTheme"/>
              </application>
          </manifest>
          EOF
          cat > android/app/src/debug/java/dev/bennett/codexmeter/DebugSeedActivity.java <<'EOF'
          package dev.bennett.codexmeter;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.util.Log;
          import java.time.Instant;
          import java.time.ZoneOffset;

          public class DebugSeedActivity extends Activity {
              private static String iso(long epochSeconds) {
                  return Instant.ofEpochSecond(epochSeconds).atOffset(ZoneOffset.UTC).toString();
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  String provider = getIntent().getStringExtra("provider");
                  String mode = getIntent().getStringExtra("mode");
                  try {
                      long now = System.currentTimeMillis();
                      long s = now / 1000L;
                      AppPreferences.completeOnboarding(this);
                      AppPreferences.setRefreshOnLaunch(this, false);
                      SecureTokenStore.save(this, UsageProvider.CODEX, new AuthTokens("demo",
                              "demo", "", now + 30L * 86400000L, "acct", "demo@example.com"));
                      String codex = "{\"plan_type\":\"plus\",\"rate_limit\":{\"allowed\":true,"
                              + "\"limit_reached\":false,\"primary_window\":{\"used_percent\":37,"
                              + "\"limit_window_seconds\":18000,\"reset_after_seconds\":5400,"
                              + "\"reset_at\":" + (s + 5400) + "},\"secondary_window\":"
                              + "{\"used_percent\":61,\"limit_window_seconds\":604800,"
                              + "\"reset_after_seconds\":200000,\"reset_at\":" + (s + 200000)
                              + "}}}";
                      UsageSnapshot codexSnapshot = UsageParser.parse(codex, now);
                      AppPreferences.saveSnapshot(this, codexSnapshot);
                      UsageHistoryRecorder.record(this, UsageProvider.CODEX, codexSnapshot);
                      if ("claude_signed_out".equals(mode)) {
                          SecureTokenStore.clear(this, UsageProvider.CLAUDE_CODE);
                          ProviderPreferences.clearProvider(this, UsageProvider.CLAUDE_CODE);
                      } else {
                          SecureTokenStore.save(this, UsageProvider.CLAUDE_CODE, new AuthTokens(
                                  "demo", "demo", "", now + 8L * 3600000L, "",
                                  "demo@example.com"));
                          String reset5h = iso(s + 7920);
                          String resetWeek = iso(s + 3L * 86400L + 5000L);
                          // Same shape as the live /api/oauth/usage response: a limits list
                          // (session + weekly, an "All models" duplicate the app skips, and a
                          // Fable-only row on accounts that have one), legacy keys, extra usage off.
                          String fable = "fable".equals(mode)
                                  ? ",{\"kind\":\"weekly_scoped\",\"group\":\"weekly\","
                                  + "\"percent\":31,\"severity\":\"normal\",\"resets_at\":\""
                                  + resetWeek + "\",\"scope\":{\"model\":{\"id\":null,"
                                  + "\"display_name\":\"Fable\"},\"surface\":null},"
                                  + "\"is_active\":false}"
                                  : "";
                          String claude = "{"
                                  + "\"five_hour\":{\"utilization\":42.0,\"resets_at\":\"" + reset5h + "\"},"
                                  + "\"seven_day\":{\"utilization\":68.0,\"resets_at\":\"" + resetWeek + "\"},"
                                  + "\"seven_day_opus\":null,\"seven_day_sonnet\":null,"
                                  + "\"iguana_necktie\":null,"
                                  + "\"limits\":["
                                  + "{\"kind\":\"session\",\"group\":\"session\",\"percent\":42,"
                                  + "\"severity\":\"normal\",\"resets_at\":\"" + reset5h + "\","
                                  + "\"scope\":null,\"is_active\":true},"
                                  + "{\"kind\":\"weekly_all\",\"group\":\"weekly\",\"percent\":68,"
                                  + "\"severity\":\"normal\",\"resets_at\":\"" + resetWeek + "\","
                                  + "\"scope\":null,\"is_active\":false},"
                                  + "{\"kind\":\"weekly_scoped\",\"group\":\"weekly\",\"percent\":68,"
                                  + "\"resets_at\":\"" + resetWeek + "\",\"scope\":{\"model\":"
                                  + "{\"id\":null,\"display_name\":\"All models\"},\"surface\":null}}"
                                  + fable + "],"
                                  + "\"extra_usage\":{\"is_enabled\":false,\"monthly_limit\":null,"
                                  + "\"used_credits\":null,\"utilization\":null}}";
                          UsageSnapshot claudeSnapshot = ClaudeUsageParser.parse(claude,
                                  "Max 5x", now);
                          ProviderPreferences.saveSnapshot(this, UsageProvider.CLAUDE_CODE,
                                  claudeSnapshot);
                          ProviderPreferences.setEmail(this, UsageProvider.CLAUDE_CODE,
                                  "demo@example.com");
                          UsageHistoryRecorder.record(this, UsageProvider.CLAUDE_CODE,
                                  claudeSnapshot);
                      }
                      ProviderPreferences.setSelected(this, UsageProvider.fromId(provider));
                  } catch (Exception e) {
                      Log.e("DebugSeed", "seed failed", e);
                  }
                  startActivity(new Intent(this, MainActivity.class)
                          .putExtra(MainActivity.EXTRA_PROVIDER, provider)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                                  | Intent.FLAG_ACTIVITY_CLEAR_TASK));
                  finish();
              }
          }
          EOF
          mkdir -p android/app/src/debug/res/menu
          cat > android/app/src/debug/res/menu/gallery_tabs.xml <<'EOF'
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/gallery_codex" android:title="Codex"
                  android:icon="@drawable/ic_oui_bracket"/>
              <item android:id="@+id/gallery_claude" android:title="Claude Code"
                  android:icon="@drawable/ic_oui_star_outline"/>
          </menu>
          EOF
          cat > android/app/src/debug/java/dev/bennett/codexmeter/DebugComponentGalleryActivity.java <<'EOF'
          package dev.bennett.codexmeter;

          import android.os.Bundle;
          import android.util.Log;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import dev.oneuiproject.oneui.widget.BottomTabLayout;
          import dev.oneuiproject.oneui.widget.RoundedTabLayout;

          /** Stock oneui-design / SESL components that can switch providers, unstyled. */
          public class DebugComponentGalleryActivity extends AppCompatActivity {
              private LinearLayout root;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(0, Ui.dp(this, 48), 0, Ui.dp(this, 24));
                  setContentView(root);
                  caption("A. BottomTabLayout (oneui-design bottom tabs)");
                  try {
                      BottomTabLayout tabs = new BottomTabLayout(this, null);
                      add(tabs);
                      tabs.inflateMenu(R.menu.gallery_tabs, item -> true);
                      tabs.setSelectedItem(1);
                  } catch (Throwable t) {
                      fail(t);
                  }
                  caption("B. RoundedTabLayout (oneui-design rounded tabs)");
                  try {
                      RoundedTabLayout tabs = new RoundedTabLayout(this);
                      tabs.addTab(tabs.newTab().setText("Codex"), false);
                      tabs.addTab(tabs.newTab().setText("Claude Code"), true);
                      add(tabs);
                  } catch (Throwable t) {
                      fail(t);
                  }
                  caption("C. BottomNavigationView (SESL material, icons + labels)");
                  try {
                      BottomNavigationView nav = new BottomNavigationView(this);
                      nav.inflateMenu(R.menu.gallery_tabs);
                      nav.setLabelVisibilityMode(
                              com.google.android.material.navigation.NavigationBarView.LABEL_VISIBILITY_LABELED);
                      nav.setSelectedItemId(R.id.gallery_claude);
                      add(nav);
                  } catch (Throwable t) {
                      fail(t);
                  }
              }

              private void caption(String text) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(15f);
                  view.setTextColor(Ui.secondaryText(Ui.isDark(this)));
                  view.setPadding(Ui.dp(this, 24), Ui.dp(this, 36), Ui.dp(this, 24), Ui.dp(this, 10));
                  root.addView(view);
              }

              private void add(View view) {
                  root.addView(view, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));
              }

              private void fail(Throwable t) {
                  Log.e("Gallery", "component failed", t);
                  caption("failed: " + t);
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          for i in 1 2 3 4; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots/android"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          shot() { sleep 6; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          seed() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/.DebugSeedActivity --es provider "$1" --es mode "$2"; }
          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY' | { read -r x y; adb shell input tap "$x" "$y"; }
          import re, sys, xml.etree.ElementTree as ET
          best = None
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == sys.argv[2] or n.get('content-desc') == sys.argv[2]:
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  if best is None or b > best[1]:
                      best = ((a + c) // 2, (b + d) // 2)
          if best is None:
              sys.exit("no node named " + sys.argv[2])
          print(best[0], best[1])
          PY
          }
          gallery() { adb shell am force-stop $PKG; sleep 1; adb shell am start -W -n $PKG/.DebugComponentGalleryActivity; }
          seed codex signed_in;               shot 01-codex-tab
          tap_text "Claude Code";             shot 02-claude-tab-after-tapping
          seed claude_code fable;             shot 03-claude-with-fable-allocation
          seed claude_code claude_signed_out; shot 04-claude-signed-out
          gallery;                            shot 05-stock-components
          adb shell cmd uimode night yes
          seed claude_code signed_in;         shot 06-claude-tab-dark
          gallery;                            shot 07-stock-components-dark
          adb shell cmd uimode night no
          EOF
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ${{ runner.temp }}/capture.sh

      - name: Dump app log on failure
        if: failure()
        run: ls -la shots/android || true

      - uses: actions/upload-artifact@v7
        with:
          name: android-shots
          path: shots/android/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-shots'
          path: shots
      - name: Publish to refs/ci-screenshots/pr118
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Provider switcher screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/pr118
