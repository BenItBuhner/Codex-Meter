name: CI

# The merge gate for main and alpha. Every job here fails on a warning. "CI gate" is the one
# required check: it passes only when every job below passed or was skipped because its area
# didn't change. Jobs run side by side and each one boots its emulator or simulator while it
# builds, so the gate takes about as long as its slowest job. Galleries, emulator scenarios, installers and release uploads live in the other
# workflows and stay optional.
on:
  pull_request:
    branches: [main, alpha]
  push:
    branches: [main, alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.areas.outputs.android }}
      desktop: ${{ steps.areas.outputs.desktop }}
      apple: ${{ steps.areas.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Work out which areas changed
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -uo pipefail
          # Fails open: on a push, a failed diff, an empty diff, a shared file or any path this
          # script doesn't know, every area runs. Only a diff it fully understands skips anything.
          everything() {
            echo "Running every area: $1"
            printf 'android=true\ndesktop=true\napple=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] || everything "not a pull request"
          files="$(git diff --name-only "$BASE...$HEAD")" || everything "git diff failed"
          [[ -n "$files" ]] || everything "empty diff"
          android=false; desktop=false; apple=false
          while IFS= read -r f; do
            case "$f" in
              .github/*|release-invariants.sh|header-case.sh|run-tests.sh|lint.sh|build.sh|.editorconfig|.swiftlint.yml|android/tests/fixtures/*)
                everything "shared file $f" ;;
              android/*|CHANGELOG.md) android=true ;;
              windows/*|linux/*) desktop=true ;;
              ios/*|macos/*) apple=true ;;
              *.md|LICENSE|.gitignore|.gitattributes) ;;
              *) everything "unclassified path $f" ;;
            esac
          done <<< "$files"
          printf 'android=%s\ndesktop=%s\napple=%s\n' "$android" "$desktop" "$apple" | tee -a "$GITHUB_OUTPUT"
      - name: Headers keep their case (no forced capitals)
        run: ./header-case.sh

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
      - name: Install Android platforms
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"
      - name: Release invariants
        run: ../release-invariants.sh
      - name: JVM self-tests and resource checks (javac -Xlint:all -Werror)
        run: ./run-tests.sh
      - name: Robolectric tests, compile with -Werror, and lint with warnings as errors
        run: |
          ./gradlew --console=plain \
            :app:testDebugUnitTest \
            :app:compileReleaseJavaWithJavac :wear:compileReleaseJavaWithJavac \
            :app:lintRelease :wear:lintRelease :wear:minifyReleaseWithR8
      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/wear/build/reports
          if-no-files-found: ignore

  payload:
    name: Payload budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: pr
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          JAR="$RUNNER_TEMP/json-20260814.jar"
          JAR_PATH="org/json/json/20260814/json-20260814.jar"
          # Maven Central rate-limits busy runners (HTTP 429); retry, then use Google's mirror of it.
          curl -fsSL --retry 4 --retry-delay 5 "https://repo1.maven.org/maven2/$JAR_PATH" -o "$JAR" \
            || curl -fsSL --retry 4 --retry-delay 5 \
              "https://maven-central.storage-download.googleapis.com/maven2/$JAR_PATH" -o "$JAR"
          {
            echo "<!-- codex-meter-payload -->"
            echo "### Payload budgets"
            echo
            bash pr/.github/scripts/payload.sh "$PWD/pr" "$PWD/main" "$JAR"
            echo
            echo "Worst cases from \`android/tests/PayloadBudgetSelfTest.java\`; the test fails past the ceiling."
          } > payload.md
          cat payload.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the table on the PR
        if: github.event_name == 'pull_request'
        # A fork's token can't comment; the table is still in the job summary.
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const body = require('fs').readFileSync('payload.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes('<!-- codex-meter-payload -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # The emulator half of the Android checks, split three ways so they run side by side. Each job
  # boots its own emulator while it builds (no hand-off between jobs). The full Android lint runs
  # in the Android job above, so these builds skip lintVital.
  performance:
    name: Android performance budgets
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Before the emulator install starts: two sdkmanager runs at once can trip over each other.
      - name: Install Android platforms
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"
      # A snapshot of a booted emulator whose packages are already compiled, cached per runner
      # image (see android/ci/emulator.sh). It resumes in seconds while Gradle builds.
      - name: Key the emulator snapshot to the runner image
        id: avd-key
        run: echo "key=avd-35-google_apis-x86_64-pixel_7-$ImageOS-$ImageVersion-v1" >> "$GITHUB_OUTPUT"
      - name: Restore the emulator snapshot
        id: avd
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/ci.avd
            ~/.android/avd/ci.ini
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: ${{ steps.avd-key.outputs.key }}
      - name: Start the emulator in the background
        run: android/ci/emulator.sh start
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
      # The release build users install, signed with a throwaway key through the same
      # localRelease signing config a local release build uses.
      - name: Build the release phone app
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p .local-signing
          printf 'perfbudget' > .local-signing/password
          keytool -genkeypair -keystore .local-signing/codex-meter-local.p12 -storetype PKCS12 \
            -storepass perfbudget -keypass perfbudget -alias codexmeter -keyalg RSA -keysize 2048 \
            -validity 1 -dname CN=perf >/dev/null
          # The APK users install (arm64) is measured for size; the emulator is x86_64, so the
          # same release build for x86_64 is the one that launches. R8 runs once for both.
          ./gradlew --console=plain :app:assembleRelease -x lintVitalRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          ./gradlew --console=plain :app:assembleRelease -x lintVitalRelease -PreleaseAbis=x86_64
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release-x86_64.apk"
      - name: Snapshot the emulator (first run on this runner image)
        if: steps.avd.outputs.cache-hit != 'true'
        run: android/ci/emulator.sh snapshot
      - name: Cache the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        # Six jobs miss at once on a new runner image; the first to finish stores it.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/ci.avd
            ~/.android/avd/ci.ini
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: ${{ steps.avd-key.outputs.key }}
      - name: Wait for the emulator
        run: android/ci/emulator.sh wait
      - name: Measure start-up, memory and size
        run: ./android/ci/perf-budgets.sh "$RUNNER_TEMP/app-release-x86_64.apk" "$RUNNER_TEMP/app-release.apk"

  # Opens every design and screen of a debug build shrunk by the release R8 rules
  # (android/ci/shrunk-smoke.sh), one design per emulator.
  shrunk-smoke:
    name: Android R8 smoke test (${{ matrix.designs }})
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        designs: [classic, one_ui_9, one_ui_9_5, liquid_glass, material_3_expressive]
    steps:
      - uses: actions/checkout@v7
      # Before the emulator install starts: two sdkmanager runs at once can trip over each other.
      - name: Install Android platforms
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"
      # A snapshot of a booted emulator whose packages are already compiled, cached per runner
      # image (see android/ci/emulator.sh). It resumes in seconds while Gradle builds.
      - name: Key the emulator snapshot to the runner image
        id: avd-key
        run: echo "key=avd-35-google_apis-x86_64-pixel_7-$ImageOS-$ImageVersion-v1" >> "$GITHUB_OUTPUT"
      - name: Restore the emulator snapshot
        id: avd
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/ci.avd
            ~/.android/avd/ci.ini
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: ${{ steps.avd-key.outputs.key }}
      - name: Start the emulator in the background
        run: android/ci/emulator.sh start
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
      - name: Build the shrunk debug app
        working-directory: android
        run: |
          ./gradlew --console=plain :app:assembleDebug -PshrinkDebug=true
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug-shrunk.apk"
      - name: Snapshot the emulator (first run on this runner image)
        if: steps.avd.outputs.cache-hit != 'true'
        run: android/ci/emulator.sh snapshot
      - name: Cache the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        # Six jobs miss at once on a new runner image; the first to finish stores it.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/ci.avd
            ~/.android/avd/ci.ini
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: ${{ steps.avd-key.outputs.key }}
      - name: Wait for the emulator
        run: android/ci/emulator.sh wait
      - name: Open every screen
        env:
          DESIGNS: ${{ matrix.designs }}
        run: ./android/ci/shrunk-smoke.sh "$RUNNER_TEMP/app-debug-shrunk.apk" shrunk-smoke
      - name: Upload the R8 smoke screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: shrunk-smoke-${{ matrix.designs }}
          path: shrunk-smoke/
          if-no-files-found: warn

  desktop:
    name: Desktop core and Linux
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install GTK 4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libsecret-1-0
      - name: Build with warnings as errors
        run: |
          dotnet build windows/tests/CodexMeter.Core.Tests -warnaserror
          dotnet build linux/tests/CodexMeter.Linux.Tests -warnaserror
      - name: Formatting
        run: |
          for project in windows/src/CodexMeter.Core windows/tests/CodexMeter.Core.Tests \
              linux/src/CodexMeter.Linux linux/tests/CodexMeter.Linux.Tests; do
            dotnet format "$project" --verify-no-changes --no-restore
          done
      - name: Core tests
        run: dotnet test windows/tests/CodexMeter.Core.Tests --no-build
      - name: Linux tests
        run: dotnet test linux/tests/CodexMeter.Linux.Tests --no-build

  windows-app:
    name: Windows app build
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build with warnings as errors
        run: dotnet build src/CodexMeter.App/CodexMeter.App.csproj -c Release -r win-x64 -p:Platform=x64 -warnaserror

  # Three macOS jobs side by side: lint, package tests and the Mac budgets; the iOS unit tests;
  # the iPhone budgets. Every build is for the runner's own architecture only. The simulator boots
  # after the build: on these 3-core runners a boot running alongside it made the build 2-2.5x
  # slower, more than the boot itself costs.
  apple-core:
    name: Apple lint, core tests and Mac performance budgets
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SIGNING_ARGS: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER= ENABLE_HARDENED_RUNTIME=NO
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint (strict; force_try is an error)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.63.2/portable_swiftlint.zip
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --reporter github-actions-logging
      - name: CodexMeterCore tests with warnings as errors
        run: swift test --package-path ios/CodexMeterCore -Xswiftc -warnings-as-errors
      - name: Build the Release Mac app
        run: |
          set -euo pipefail
          xcodebuild build -project macos/CodexMeterMac.xcodeproj -scheme CodexMeterMac -configuration Release \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mac" $SIGNING_ARGS \
            ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Measure Mac start-up and memory
        run: macos/ci/perf-budgets.sh mac "$RUNNER_TEMP/mac/Build/Products/Release/Codex Meter.app"

  apple:
    name: iOS unit tests
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Warnings are errors through the project's own build settings. Passing them on the
      # command line would also reach the CodexMeterCore package, which Xcode builds with
      # -suppress-warnings, and the two flags conflict. swift test (above) covers the package.
      - name: Build the iOS unit tests with warnings as errors
        working-directory: ios
        run: |
          set -euo pipefail
          # A generic destination, so the build never waits on CoreSimulator; arm64 is the
          # runner's architecture.
          xcodebuild build-for-testing -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            -only-testing:CodexMeterTests \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Boot an iPhone simulator
        id: simulator
        run: macos/ci/boot-simulator.sh
      - name: Wait for the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          SECONDS=0
          xcrun simctl bootstatus "$UDID" -b
          echo "Booted in ${SECONDS}s"
      - name: Run the iOS unit tests
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project CodexMeter.xcodeproj -scheme CodexMeter \
            -destination "id=$UDID" -derivedDataPath DerivedData \
            -only-testing:CodexMeterTests \
            CODE_SIGNING_ALLOWED=NO

  apple-performance:
    name: iPhone performance budgets
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the Release iPhone app
        run: |
          set -euo pipefail
          # Generic destination (see the iOS unit tests job), built for arm64, the runner's arch.
          xcodebuild build -project ios/CodexMeter.xcodeproj -scheme CodexMeter -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Boot an iPhone simulator
        id: simulator
        run: macos/ci/boot-simulator.sh
      - name: Measure iPhone start-up and memory
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          SECONDS=0
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          echo "Booted in ${SECONDS}s"
          APP="$(find "$RUNNER_TEMP/ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)"
          macos/ci/perf-budgets.sh ios "$APP" "$UDID"
      - name: Upload screenshots of a launch that printed no first frame
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-perf-budget-screens
          path: ${{ runner.temp }}/perf-budget-*.png
          if-no-files-found: ignore

  # Start-up time and memory for the desktop apps, as the jobs above measure the phone and Apple
  # apps. Each app, launched with -perf-budget / --perf-budget, reports its own first frame;
  # the scripts hold the ceilings and why they are where they are.
  linux-performance:
    name: Linux performance budgets
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install GTK 4, libadwaita and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 libsecret-1-0 adwaita-icon-theme fonts-cantarell \
            xvfb xauth dbus dbus-x11
      - name: Publish the release build
        run: linux/packaging/publish.sh x64
      - name: Measure start-up and memory
        # The runner has no GPU, so the app draws with cairo. GTK still opens an OpenGL context at
        # start-up unless told not to, which loads Mesa's software renderer (llvmpipe, libLLVM):
        # about 70 MB and 50 ms the cairo-drawn app never uses. Turning GL off measures the app.
        env:
          GSK_RENDERER: cairo
          GDK_DEBUG: gl-disable
          GTK_A11Y: none
        run: |
          xvfb-run -a -s "-screen 0 1400x1000x24" dbus-run-session -- \
            linux/ci/perf-budgets.sh linux/out/publish-x64/codex-meter

  windows-performance:
    name: Windows performance budgets
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the release build
        run: dotnet publish src/CodexMeter.App/CodexMeter.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/perf
      - name: Measure start-up and memory
        run: ./ci/perf-budgets.ps1 -App out/perf/CodexMeter.exe
      - name: Show app log
        if: failure()
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CodexMeter/codexmeter.log'
          if (Test-Path $log) { Get-Content $log } else { 'No log written.' }

  gate:
    name: CI gate
    if: always()
    needs: [changes, android, performance, shrunk-smoke, payload, desktop, windows-app, apple-core,
            apple, linux-performance, windows-performance, apple-performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped for an unchanged area
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '.changes.result != "success" or ([.[].result] | any(. == "failure" or . == "cancelled"))' >/dev/null; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
