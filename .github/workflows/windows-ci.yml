name: Windows CI

on:
  pull_request:
    branches: [main, alpha]
    paths:
      - 'windows/**'
      - 'ios/CodexMeterCore/Tests/CodexMeterCoreTests/Fixtures/**'
      - 'android/tests/fixtures/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: ['claude/**']
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
    # Release tags build the app and attach it to the GitHub release (path filters don't apply to tags).
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: an existing release tag (like v2.9.0-alpha.14) to build and attach the Windows app to'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # The release tag this run builds for, or empty for an ordinary CI run.
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  core-tests:
    name: Shared core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || '' }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test CodexMeter.Core
        run: dotnet test tests/CodexMeter.Core.Tests --logger "console;verbosity=normal"

  app:
    name: Build, UI-test and screenshot the app
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || '' }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test CodexMeter.Core on Windows
        run: dotnet test tests/CodexMeter.Core.Tests

      - name: Publish x64 and ARM64
        run: |
          # Release builds carry the tag's version (v2.9.0-alpha.14 -> 2.9.0-alpha.14).
          $versionArgs = @()
          if ($env:RELEASE_TAG) { $versionArgs = @("-p:Version=$($env:RELEASE_TAG.TrimStart('v'))") }
          foreach ($arch in 'x64', 'arm64') {
            $platform = if ($arch -eq 'x64') { 'x64' } else { 'ARM64' }
            dotnet publish src/CodexMeter.App/CodexMeter.App.csproj -c Release -r "win-$arch" -p:Platform=$platform -o "out/CodexMeter-win-$arch" @versionArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem out/CodexMeter-win-x64 -Filter CodexMeter.exe | Format-List Name, Length

      - name: Use a 1080p desktop
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Capture screenshots
        run: |
          $shots = Join-Path $PWD 'out/screenshots'
          $p = Start-Process -FilePath out/CodexMeter-win-x64/CodexMeter.exe -ArgumentList '--screenshots', "`"$shots`"" -PassThru
          $null = $p.Handle  # keeps the exit code readable after exit
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'Screenshot run timed out' }
          Get-ChildItem $shots | Format-Table Name, Length
          $log = Join-Path $env:LOCALAPPDATA 'CodexMeter/codexmeter.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Screenshot run exited with $($p.ExitCode)" }
          if ((Get-ChildItem $shots -Filter '*.png').Count -lt 10) { throw 'Too few screenshots' }

      - name: UI automation tests
        env:
          CODEXMETER_EXE: ${{ github.workspace }}\windows\out\CodexMeter-win-x64\CodexMeter.exe
        run: dotnet test tests/CodexMeter.App.UITests --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-tests.trx" --results-directory out/test-results

      - name: Show app log
        if: always()
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CodexMeter/codexmeter.log'
          if (Test-Path $log) { Get-Content $log } else { 'No log written.' }

      - name: Zip builds
        if: always()
        run: |
          foreach ($arch in 'x64', 'arm64') {
            if (Test-Path "out/CodexMeter-win-$arch") { Compress-Archive -Path "out/CodexMeter-win-$arch/*" -DestinationPath "out/CodexMeter-win-$arch.zip" -Force }
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-screenshots
          path: windows/out/screenshots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-test-results
          path: windows/out/test-results
          if-no-files-found: ignore

      - name: Upload x64 build
        uses: actions/upload-artifact@v7
        with:
          name: CodexMeter-win-x64
          path: windows/out/CodexMeter-win-x64.zip

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v7
        with:
          name: CodexMeter-win-arm64
          path: windows/out/CodexMeter-win-arm64.zip

  release:
    name: Attach to the GitHub release
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: [core-tests, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: CodexMeter-win-*
          merge-multiple: true
          path: dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd dist
          mv CodexMeter-win-x64.zip "CodexMeter-$version-windows-x64.zip"
          mv CodexMeter-win-arm64.zip "CodexMeter-$version-windows-arm64.zip"
          sha256sum CodexMeter-*-windows-*.zip > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
          # The Android workflow creates and publishes the release; wait for it, and only create a
          # draft ourselves if it hasn't appeared (the Android job then edits and publishes it).
          for attempt in $(seq 1 30); do
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=false
            [[ "$version" == *-* ]] && prerelease=true
            gh release create "$RELEASE_TAG" --draft --verify-tag --prerelease="$prerelease" \
              --title "Codex Meter $version" --notes "Codex Meter $version" || true
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "CodexMeter-$version-windows-x64.zip#Codex Meter for Windows (x64, portable .zip)" \
            "CodexMeter-$version-windows-arm64.zip#Codex Meter for Windows (ARM64, portable .zip)" \
            "SHA256SUMS-windows.txt"
