name: Show in AI apps screenshots (temporary)

# One-off: installs this branch plus two code-free stand-in apps that use the ChatGPT and Claude
# package names, then records the live notification appearing in each and leaving with them.
# Output goes to refs/ci-screenshots/app-sessions. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-dt0441]
    paths: ['.github/workflows/app-session-screenshots.yml', '.github/app-session-shots/**',
            'android/app/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          cp .github/app-session-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          python3 - "$DBG/AndroidManifest.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('</application>', '<activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay"/>\n    </application>')
          open(p, 'w').write(s)
          PY

      - name: Build debug APK and stand-in apps
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash .github/app-session-shots/make-stub.sh com.anthropic.claude "Claude (test stand-in)" "$RUNNER_TEMP/claude.apk"
          bash .github/app-session-shots/make-stub.sh com.openai.chatgpt "ChatGPT (test stand-in)" "$RUNNER_TEMP/chatgpt.apk"
          cd android
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$RUNNER_TEMP/claude.apk"
          adb install -r "$RUNNER_TEMP/chatgpt.apk"
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          shot() { sleep "${2:-3}"; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          # Force-stopping the app also switches its accessibility service off, so app
          # detection is turned back on after each reseed, before the screen opens.
          A11Y=0
          seed() {
            adb shell am force-stop $PKG; sleep 1
            adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es open none --es design "${2:-oneui9}" --es sessions "${3:-on}"; sleep 2
            [[ $A11Y == 1 ]] && a11y_on
            if [[ "$1" != none ]]; then
              adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es open "$1" --es reseed no; sleep 3
            fi
          }
          locate() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == sys.argv[2] or n.get('content-desc') == sys.argv[2]:
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  print((a + c) // 2, (b + d) // 2)
                  sys.exit(0)
          sys.exit("no node named " + sys.argv[2])
          PY
          }
          tap_text() { local xy; xy=$(locate "$1") && adb shell input tap $xy; }
          drag() { adb shell input swipe 540 1600 540 $((1600 - $1)) 1200; }
          shade() { adb shell cmd statusbar expand-notifications; }
          noshade() { adb shell cmd statusbar collapse; }
          a11y_on() {
            # Sideloaded apps need "Allow restricted settings" before accessibility can be on.
            adb shell appops set $PKG ACCESS_RESTRICTED_SETTINGS allow || true
            adb shell settings put secure enabled_accessibility_services $PKG/dev.bennett.codexmeter.AppSessionService
            adb shell settings put secure accessibility_enabled 1
            sleep 3
            echo "enabled: $(adb shell settings get secure enabled_accessibility_services)" >> "$OUT/a11y.txt"
            adb shell dumpsys accessibility | head -80 >> "$OUT/a11y.txt" || true
          }
          a11y_off() {
            adb shell settings delete secure enabled_accessibility_services || true
            adb shell settings put secure accessibility_enabled 0
          }

          # Turning it on before app detection is allowed shows the disclosure.
          a11y_off
          adb shell cmd uimode night no
          seed app_sessions oneui9 off
          shot light-01-page-off
          tap_text "Show while an AI app is open"; shot light-02-disclosure 2
          adb shell input keyevent BACK; sleep 1

          A11Y=1
          for mode in light dark; do
            [[ $mode == dark ]] && adb shell cmd uimode night yes || adb shell cmd uimode night no
            seed app_sessions;            shot $mode-03-page-on
            drag 900;                     shot $mode-04-page-on-scrolled
            seed now_bar;                 drag 1400; shot $mode-05-now-bar-entry
            seed app_sessions classic;    shot $mode-06-page-classic
          done

          # The walk-through: open Claude, look, go home, open ChatGPT, look, go home.
          for mode in light dark; do
            [[ $mode == dark ]] && adb shell cmd uimode night yes || adb shell cmd uimode night no
            seed none
            adb shell input keyevent HOME; sleep 2
            adb shell "screenrecord --time-limit 60 --size 540x1200 /sdcard/walk-$mode.mp4" & REC=$!
            sleep 2
            adb shell am start -n com.anthropic.claude/android.app.Activity
            shot $mode-10-in-claude 4
            shade; shot $mode-11-claude-shade 3; noshade; sleep 1
            adb shell input keyevent HOME
            sleep 4; shade; shot $mode-12-home-shade-after-claude 3; noshade; sleep 1
            adb shell am start -n com.openai.chatgpt/android.app.Activity
            shot $mode-13-in-chatgpt 4
            shade; shot $mode-14-chatgpt-shade 3; noshade; sleep 1
            adb shell input keyevent HOME
            sleep 4; shade; shot $mode-15-home-shade-after-chatgpt 3; noshade
            wait $REC
            adb pull /sdcard/walk-$mode.mp4 "$OUT/walk-$mode.mp4" >/dev/null
          done
          adb shell cmd uimode night no
          adb shell dumpsys notification --noredact | grep -A3 "pkg=$PKG" > "$OUT/notifications.txt" || true
          echo "after walk: $(adb shell settings get secure enabled_accessibility_services)" >> "$OUT/a11y.txt"
          adb logcat -d | grep -iE "app_session|CodexNowBar|DebugSeed|FATAL|AndroidRuntime|ccessibility|codexmeter|EnhancedConfirmation|restricted" > "$OUT/logcat.txt" || true
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash ${{ runner.temp }}/capture.sh

      - name: Turn recordings into frame strips
        shell: bash
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          cd shots
          for f in walk-*.mp4; do
            [[ -f "$f" ]] || continue
            ffmpeg -loglevel error -i "$f" -vf "fps=1,scale=180:-1,tile=10x5" -frames:v 1 "${f%.mp4}-frames.png" || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shots
          path: shots
      - name: Publish to refs/ci-screenshots/app-sessions
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Show in AI apps screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/app-sessions
