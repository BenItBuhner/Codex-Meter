name: Show in AI apps robustness run (temporary)

# One-off: installs this branch plus two code-free stand-in apps that use the ChatGPT and Claude
# package names, then records the live notification appearing in each and leaving with them.
# Output goes to refs/ci-screenshots/app-sessions-v2. Removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-dt0441]
    paths: ['.github/workflows/app-session-screenshots.yml', '.github/app-session-shots/**',
            'android/app/**']

permissions:
  contents: write
  packages: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Add the debug-only sample-data seeder
        shell: bash
        run: |
          set -euo pipefail
          DBG=android/app/src/debug
          cp .github/app-session-shots/DebugSeedActivity.java "$DBG/java/dev/bennett/codexmeter/"
          python3 - "$DBG/AndroidManifest.xml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          s = s.replace('</application>', '<activity android:name="dev.bennett.codexmeter.DebugSeedActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay"/>\n    </application>')
          open(p, 'w').write(s)
          PY

      - name: Build debug APK and stand-in apps
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash .github/app-session-shots/make-stub.sh com.anthropic.claude "Claude (test stand-in)" "$RUNNER_TEMP/claude.apk"
          bash .github/app-session-shots/make-stub.sh com.openai.chatgpt "ChatGPT (test stand-in)" "$RUNNER_TEMP/chatgpt.apk"
          cd android
          for i in 1 2 3; do
            ./gradlew --no-daemon :app:assembleDebug && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write capture script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          PKG=dev.bennett.codexmeter
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$RUNNER_TEMP/claude.apk"
          adb install -r "$RUNNER_TEMP/chatgpt.apk"
          adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true
          adb shell cmd connectivity airplane-mode enable || true
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb shell cmd uimode night no
          shot() { sleep "${2:-1}"; adb exec-out screencap -p > "$OUT/$1.png"; echo "captured $1"; }
          a11y_on() {
            adb shell appops set $PKG ACCESS_RESTRICTED_SETTINGS allow || true
            adb shell settings put secure enabled_accessibility_services $PKG/dev.bennett.codexmeter.AppSessionService
            adb shell settings put secure accessibility_enabled 1
            sleep 3
          }
          adb shell am start -W -n $PKG/dev.bennett.codexmeter.DebugSeedActivity --es open none
          sleep 2
          a11y_on
          adb shell input keyevent HOME; sleep 2
          # present: is the live notification posted right now?
          present() { adb shell dumpsys notification --noredact | grep -q "pkg=$PKG.*id=8610"; }
          # Polls until the notification is in the wanted state; prints how long that took.
          await() {
            local want=$1 t0=$(date +%s%3N) now
            for i in $(seq 1 60); do
              if present; then got=shown; else got=hidden; fi
              now=$(date +%s%3N)
              if [[ $got == $want ]]; then echo "$((now - t0))"; return 0; fi
              sleep 0.05
            done
            echo "TIMEOUT"; return 1
          }
          RESULTS="$OUT/results.md"
          echo "| # | Step | Expected | Result | Seen after (ms, incl. ~40 ms adb poll) |" > "$RESULTS"
          echo "|---|---|---|---|---|" >> "$RESULTS"
          N=0
          step() { # step "label" want command...
            local label="$1" want="$2"; shift 2
            N=$((N + 1))
            "$@"
            local ms; ms=$(await "$want")
            local ok=PASS; [[ "$ms" == TIMEOUT ]] && ok=FAIL
            echo "| $N | $label | $want | $ok | $ms |" | tee -a "$RESULTS"
          }
          open_claude() { adb shell am start -n com.anthropic.claude/android.app.Activity >/dev/null; }
          open_chatgpt() { adb shell am start -n com.openai.chatgpt/android.app.Activity >/dev/null; }
          home() { adb shell input keyevent HOME; }
          from_recents() { # open Recents and tap the newest card (centre of the screen)
            adb shell input keyevent KEYCODE_APP_SWITCH; sleep 1.2
            adb shell input tap 540 1100
          }
          back_out() { adb shell input keyevent BACK; }
          adb shell "screenrecord --time-limit 170 --size 540x1200 /sdcard/robustness.mp4" & REC=$!
          sleep 2
          step "Cold open Claude" shown open_claude
          shot r01-claude-cold
          step "Home" hidden home
          step "Reopen Claude from Recents (warm)" shown from_recents
          shot r02-claude-from-recents
          step "Home" hidden home
          step "Reopen Claude from its icon (warm)" shown open_claude
          step "Switch straight to ChatGPT" shown open_chatgpt
          adb shell cmd statusbar expand-notifications; shot r03-chatgpt-shade 1.5
          adb shell cmd statusbar collapse; sleep 0.5
          step "Pull down shade over ChatGPT (stays)" shown adb shell cmd statusbar expand-notifications
          adb shell cmd statusbar collapse; sleep 0.5
          step "Home" hidden home
          for i in 1 2 3 4 5 6; do
            step "Loop $i: Claude from Recents" shown from_recents
            step "Loop $i: Home" hidden home
            step "Loop $i: Claude from icon" shown open_claude
            step "Loop $i: Back out to home" hidden back_out
          done
          # Swipe-away while in the app keeps it hidden until the user leaves.
          open_claude; await shown >/dev/null
          adb shell cmd statusbar expand-notifications; sleep 1.5
          STOP=$(adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml "$RUNNER_TEMP/ui.xml" >/dev/null; python3 - "$RUNNER_TEMP/ui.xml" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          for n in ET.parse(sys.argv[1]).iter('node'):
              if n.get('text') == 'Stop':
                  a, b, c, d = map(int, re.findall(r'\d+', n.get('bounds')))
                  print((a + c) // 2, (b + d) // 2); break
          PY
          )
          if [[ -n "$STOP" ]]; then
            step "Tap Stop while in Claude" hidden adb shell input tap $STOP
            adb shell cmd statusbar collapse; sleep 2
            N=$((N + 1)); if present; then r=FAIL; else r=PASS; fi
            echo "| $N | Still in Claude 2 s later (stays dismissed) | hidden | $r | |" | tee -a "$RESULTS"
            step "Home" hidden home
            step "Reopen Claude (shows again)" shown from_recents
          else
            echo "| - | Stop button not found in shade | | SKIP | |" >> "$RESULTS"
            adb shell cmd statusbar collapse
          fi
          home; sleep 2
          wait $REC
          adb pull /sdcard/robustness.mp4 "$OUT/robustness.mp4" >/dev/null
          adb logcat -d -v threadtime | grep -E "CodexAppSession|CodexNowBar|FATAL|AndroidRuntime" > "$OUT/logcat.txt" || true
          grep -E "CodexAppSession: (show|hide)" "$OUT/logcat.txt" > "$OUT/timings.txt" || true
          cat "$RESULTS"
          SH
          chmod +x "$RUNNER_TEMP/capture.sh"

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash ${{ runner.temp }}/capture.sh

      - name: Turn recordings into frame strips
        shell: bash
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          cd shots
          for f in *.mp4; do
            [[ -f "$f" ]] || continue
            ffmpeg -loglevel error -i "$f" -vf "fps=0.5,scale=180:-1,tile=10x9" -frames:v 1 "${f%.mp4}-frames.png" || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shots
          path: shots
      - name: Publish to refs/ci-screenshots/app-sessions-v2
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd shots
          find . -type f | sort
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Show in AI apps screenshots"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci-screenshots/app-sessions-v2
